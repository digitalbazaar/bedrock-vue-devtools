name: Lint CI

on: [push, pull_request]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26.x
    - run: npm install
    - name: Run eslint
      run: npm run lint
